name: Deploy Application

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # MUST COME BEFORE COMPOSER INSTALL
      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.1' # Forces PHP 8.4.1 to satisfy locked Symfony 8.1 / Laravel dependencies
          extensions: mbstring, xml, ctype, iconv, mysql, gd
          tools: composer:v2

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Discover Laravel Packages
        run: php artisan package:discover --ansi

      - name: Generate Spatie TypeScript Types
        run: |
          php artisan typescript:transform
          php artisan structure:discover

      - name: Generate Wayfinder Routes and Form Variants
        run: php artisan wayfinder:generate --with-form

      - name: Install Node & Build Assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci
          npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: public/build/
          retention-days: 1
